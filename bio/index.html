<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bruna Medeiros | Links</title>
<meta name="description" content="Todos os meus links em um lugar só: redes sociais, portfólio, equipamentos e contato.">
<meta name="theme-color" content="#FAF9F4">
<link rel="icon" type="image/png" href="/favicon.png">

<meta property="og:title" content="Bruna Medeiros | Links">
<meta property="og:description" content="Redes sociais, portfólio, equipamentos e contato da Bruna Medeiros.">
<meta property="og:image" content="https://brunamedeiros.com/fotos/hero-capa.png">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Pinyon+Script&family=Newsreader:ital,wght@0,800;1,700&display=swap" rel="stylesheet">

<style>
@font-face{
  font-family:'Bootzy TM';
  src:url('/fonts/BootzyTM.woff2') format('woff2');
  font-weight:normal; font-style:normal; font-display:swap;
}

:root{
  --blue-light:#7DB7CE;
  --gray-light:#F1F1F1;
  --blue-dark:#04465D;
  --white:#FFFFFF;
  --offwhite:#FAF9F4;
  --blue-dark-70:rgba(4,70,93,0.7);
  --blue-dark-15:rgba(4,70,93,0.12);
  --glass-bg:rgba(255,255,255,0.38);
  --glass-brd:rgba(255,255,255,0.55);
  --shadow-soft:0 20px 45px rgba(4,70,93,0.16);
  --shadow-hard:0 10px 24px rgba(4,70,93,0.22);
  --font-display:'Newsreader', Georgia, serif;
  --font-bootzy:'Bootzy TM','Newsreader',Georgia,serif;
  --font-body:'Montserrat', sans-serif;
  --font-script:'Pinyon Script', cursive;
  --font-system:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}

*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html{ scroll-behavior:smooth; }
body{
  font-family:var(--font-body);
  color:var(--blue-dark);
  background:var(--offwhite);
  overflow-x:hidden;
  min-height:100vh;
}
/* mesma camada de fundo do portfólio: off-white com as manchas azuis desfocadas */
.backdrop{
  position:fixed; inset:0; z-index:-1;
  background:var(--offwhite) url("/fotos/fundo-hero.png") center/cover no-repeat;
}
img{ max-width:100%; display:block; }
a{ color:inherit; text-decoration:none; }
button, input{ font-family:inherit; }
::selection{ background:var(--blue-light); color:var(--blue-dark); }

/* A página é feita só pro tamanho de celular: no computador ela continua
   do mesmo tamanho, centralizada, sem esticar. */
.bio{
  width:100%; max-width:430px; margin:0 auto;
  min-height:100vh; position:relative; overflow:hidden;
  background:rgba(250,249,244,0.55);
  box-shadow:0 0 0 1px rgba(4,70,93,0.06), 0 30px 80px rgba(4,70,93,0.18);
}

/* =====================  TOPO  ===================== */
.hero{ position:relative; height:540px; overflow:hidden; }
.hero-glow{
  position:absolute; inset:0;
  background:
    radial-gradient(70% 55% at 78% 22%, rgba(125,183,206,0.85) 0%, rgba(125,183,206,0) 70%),
    radial-gradient(60% 50% at 12% 70%, rgba(147,197,253,0.7) 0%, rgba(147,197,253,0) 72%),
    linear-gradient(180deg, #DCEBF3 0%, #EEF4F6 55%, var(--offwhite) 100%);
}
.hero-photo{
  position:absolute; left:50%; bottom:0; transform:translateX(-50%);
  height:100%; width:auto; max-width:none; object-fit:contain; object-position:50% 100%;
  filter:drop-shadow(0 18px 30px rgba(4,70,93,0.22));
}
.hero-fade{
  position:absolute; left:0; right:0; bottom:0; height:46%;
  background:linear-gradient(180deg, rgba(250,249,244,0) 0%, rgba(250,249,244,0.78) 62%, var(--offwhite) 100%);
}
.hero-name{
  position:absolute; left:0; right:0; bottom:18px; text-align:center; padding:0 20px;
}
.hero-name h1{
  font-family:var(--font-script); font-weight:400;
  font-size:clamp(2.5rem, 11vw, 3.4rem); line-height:1; white-space:nowrap; color:color-mix(in srgb, var(--blue-light) 62%, var(--blue-dark));
  text-shadow:0 2px 18px rgba(250,249,244,0.9);
}
.hero-name p{
  margin-top:8px;
  font-weight:700; font-size:.68rem; letter-spacing:.16em; text-transform:uppercase;
  color:color-mix(in srgb, var(--blue-light) 62%, var(--blue-dark));
}

/* =====================  REDES  ===================== */
.socials{
  display:flex; justify-content:center; gap:14px; padding:6px 20px 0;
}
.social{
  width:52px; height:52px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:var(--glass-bg);
  backdrop-filter:blur(18px) saturate(150%); -webkit-backdrop-filter:blur(18px) saturate(150%);
  border:1px solid var(--glass-brd);
  box-shadow:var(--shadow-soft);
  color:var(--blue-light);
  transition:transform .18s cubic-bezier(.2,.8,.2,1), background .2s ease;
}
.social svg{ width:23px; height:23px; }
.social:active{ transform:scale(.92); }
@media (hover:hover){ .social:hover{ transform:translateY(-4px) scale(1.06); background:rgba(255,255,255,0.6); } }

.chat-hint{
  text-align:center; padding:26px 12px 0; white-space:nowrap;
  font-weight:600; font-size:min(.88rem, 3.5vw); line-height:1.45; color:var(--blue-light);
}
.chat-hint-arrow{
  display:block; margin:10px auto 0; width:22px; height:22px; color:var(--blue-light);
  animation:bounce 1.6s ease-in-out infinite;
}
@keyframes bounce{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(6px); } }

/* =====================  CONCIERGE  ===================== */
.section{ padding:0 18px; }
.concierge-btn{
  display:flex; align-items:center; gap:13px; width:100%; max-width:340px; margin:16px auto 0;
  padding:9px 18px 9px 9px; border:none; cursor:pointer; text-align:left; border-radius:999px;
  background:var(--blue-light); color:#f1f1f1; box-shadow:var(--shadow-soft);
  font-family:var(--font-body); transition:transform .15s ease;
}
.concierge-btn:active{ transform:scale(.96); }
.concierge-btn-icon{ width:46px; height:46px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(4,70,93,0.18); }
.concierge-btn-icon svg{ width:100%; height:100%; display:block; }
.concierge-btn small{ display:block; font-size:.62rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; opacity:.85; }
.concierge-btn strong{ display:block; font-size:.92rem; font-weight:800; line-height:1.25; }
.concierge-btn-seta{ margin-left:auto; width:18px; height:18px; flex-shrink:0; }

.modal{
  position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; padding:16px;
  visibility:hidden; opacity:0; transition:opacity .25s ease, visibility .25s ease;
}
.modal.open{ visibility:visible; opacity:1; }
.modal-backdrop{ position:absolute; inset:0; background:rgba(4,70,93,0.42); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
.concierge{
  position:relative; width:100%; max-width:398px;
  height:min(640px, calc(100vh - 32px)); height:min(640px, calc(100dvh - 32px));
  display:flex; flex-direction:column; background:var(--offwhite); border-radius:28px; overflow:hidden;
  box-shadow:0 30px 80px rgba(4,70,93,0.35); font-family:var(--font-system);
  transform:translateY(24px) scale(.96); transition:transform .3s cubic-bezier(.2,.8,.2,1);
}
.modal.open .concierge{ transform:none; }
.concierge-close{
  margin-left:auto; width:34px; height:34px; border-radius:50%; border:none; cursor:pointer; flex-shrink:0;
  background:rgba(4,70,93,0.08); color:var(--blue-dark); display:flex; align-items:center; justify-content:center;
}
.concierge-close svg{ width:16px; height:16px; }
.concierge-top{
  display:flex; align-items:center; gap:10px; padding:12px 16px;
  background:var(--white); border-bottom:1px solid rgba(4,70,93,0.08);
}
.concierge-avatar{
  width:38px; height:38px; border-radius:50%; overflow:hidden; flex-shrink:0;
  border:2px solid var(--white); box-shadow:0 4px 10px rgba(4,70,93,0.18);
}
.concierge-avatar img{ width:100%; height:100%; object-fit:cover; object-position:center 22%; }
.concierge-top strong{ display:block; font-size:.92rem; font-weight:700; line-height:1.2; }
.concierge-top div span{ display:flex; align-items:center; gap:5px; font-size:.7rem; color:var(--blue-dark-70); }
.concierge-top div span::before{ content:""; width:7px; height:7px; border-radius:50%; background:#34C759; }

.chat-body{
  position:relative; flex:1; min-height:0;
  background:
    radial-gradient(rgba(4,70,93,0.09) 1px, transparent 1.4px) 0 0/16px 16px,
    rgba(250,249,244,0.62);
}
.chat-log{
  height:100%; overflow-y:auto; padding:16px 14px 10px;
  display:flex; flex-direction:column; gap:8px; scroll-behavior:smooth;
  scrollbar-width:none;
}

/* tela de início */
.chat-start{
  position:absolute; inset:0; z-index:2; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:6px; padding:20px; text-align:center;
  background:rgba(250,249,244,0.94);
  transition:opacity .3s ease, visibility .3s ease;
}
.chat-start.off{ opacity:0; visibility:hidden; pointer-events:none; }
.chat-start-avatar{
  width:96px; height:96px; border-radius:50%; padding:5px; margin-bottom:14px;
  background:linear-gradient(135deg, var(--blue-light), var(--white) 50%, var(--blue-light));
  box-shadow:var(--shadow-soft);
}
.chat-start-avatar img{ width:100%; height:100%; border-radius:50%; object-fit:cover; object-position:center 22%; border:3px solid var(--white); }
.chat-start strong{ font-size:1.12rem; font-weight:800; }
.chat-start p{ font-size:.82rem; color:var(--blue-dark-70); }
.chat-start-btn{
  margin-top:14px; border:none; cursor:pointer; background:var(--blue-light); color:#f1f1f1;
  font-size:.84rem; font-weight:800; padding:10px 24px; border-radius:999px; box-shadow:var(--shadow-hard);
  transition:transform .15s ease;
}
.chat-start-btn:active{ transform:scale(.94); }

.opcoes{ align-self:flex-start; display:flex; flex-wrap:wrap; gap:8px; max-width:92%; animation:msgIn .28s .05s cubic-bezier(.2,.8,.2,1) both; }
.opcao{
  border:1.5px solid var(--blue-light); background:rgba(255,255,255,0.9); color:var(--blue-dark);
  font-size:.76rem; font-weight:700; padding:7px 13px; border-radius:999px; cursor:pointer;
  transition:background .15s ease, color .15s ease, transform .15s ease;
}
.opcao:active{ background:var(--blue-light); transform:scale(.95); }
.opcao.suave{ border-color:rgba(4,70,93,0.25); font-weight:600; font-size:.74rem; color:var(--blue-dark-70); }
.chat-log::-webkit-scrollbar{ display:none; }
.msg{
  max-width:84%; padding:10px 14px; border-radius:20px;
  font-size:.88rem; line-height:1.4; word-wrap:break-word;
  animation:msgIn .28s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes msgIn{ from{ opacity:0; transform:translateY(8px) scale(.97); } to{ opacity:1; transform:none; } }
.msg.bot{ align-self:flex-start; background:var(--white); border-bottom-left-radius:6px; box-shadow:0 2px 8px rgba(4,70,93,0.08); }
.msg.user{ align-self:flex-end; background:var(--blue-light); color:#f1f1f1; border-bottom-right-radius:6px; }
.msg-actions{ align-self:flex-start; display:flex; flex-direction:column; gap:6px; max-width:84%; animation:msgIn .28s .08s cubic-bezier(.2,.8,.2,1) both; }
.msg-action{
  display:inline-flex; align-items:center; justify-content:space-between; gap:12px;
  padding:8px 14px; border-radius:14px; font-size:.7rem; font-weight:800; letter-spacing:.05em; text-transform:uppercase;
  background:var(--blue-light); color:#f1f1f1; box-shadow:0 2px 8px rgba(4,70,93,0.1);
}
.msg-action::after{ content:"→"; }
.typing{ align-self:flex-start; display:flex; gap:4px; padding:13px 15px; background:var(--white); border-radius:20px; border-bottom-left-radius:6px; }
.typing i{ width:7px; height:7px; border-radius:50%; background:var(--blue-light); animation:dot 1.1s infinite; }
.typing i:nth-child(2){ animation-delay:.15s; } .typing i:nth-child(3){ animation-delay:.3s; }
@keyframes dot{ 0%,60%,100%{ transform:translateY(0); opacity:.5; } 30%{ transform:translateY(-4px); opacity:1; } }

.chat-form{ display:flex; gap:8px; padding:10px 12px 14px; background:rgba(255,255,255,0.45); border-top:1px solid rgba(255,255,255,0.6); }
.chat-input{
  flex:1; min-width:0; border:1px solid rgba(4,70,93,0.16); background:rgba(255,255,255,0.8);
  border-radius:999px; padding:12px 16px; font-size:16px; color:var(--blue-dark); outline:none;
}
.chat-input:focus{ border-color:var(--blue-light); box-shadow:0 0 0 3px rgba(125,183,206,0.3); }
.chat-send{
  width:42px; height:42px; border-radius:50%; border:none; flex-shrink:0; cursor:pointer;
  background:var(--blue-light); color:#f1f1f1;
  display:flex; align-items:center; justify-content:center; transition:transform .15s ease;
}
.chat-send:active{ transform:scale(.9); }
.chat-send:disabled{ opacity:.4; }
.chat-input:disabled{ background:rgba(241,241,241,0.7); }
.chat-send svg{ width:20px; height:20px; }

.email-line{ text-align:center; margin-top:14px; font-size:.78rem; color:var(--blue-light); }
.email-line a{ font-weight:700; color:var(--blue-light); border-bottom:1px solid var(--blue-light); }

/* =====================  BLOCOS  ===================== */

.eyebrow{ text-align:center; font-size:.66rem; font-weight:800; letter-spacing:.18em; text-transform:uppercase; color:var(--blue-dark-70); }
.btn-portfolio{
  display:flex; align-items:center; gap:12px; margin-top:10px; text-align:left;
  background:var(--blue-light); color:#f1f1f1;
  padding:12px 16px 12px 12px; border-radius:20px;
  box-shadow:var(--shadow-soft); transition:transform .18s ease;
}
.btn-portfolio:active{ transform:scale(.97); }
.btn-portfolio-icon{ width:40px; height:40px; border-radius:12px; flex-shrink:0; background:rgba(255,255,255,0.6); color:var(--blue-dark); display:flex; align-items:center; justify-content:center; }
.btn-portfolio-icon svg{ width:19px; height:19px; }
.btn-portfolio-txt{ flex:1; min-width:0; }
.btn-portfolio-txt strong{ display:block; font-size:.92rem; font-weight:800; line-height:1.25; }
.btn-portfolio-txt small{ display:block; margin-top:2px; font-size:.7rem; font-weight:500; line-height:1.35; color:#f1f1f1; opacity:.9; }
.btn-portfolio-seta{ width:18px; height:18px; flex-shrink:0; }

.widget{
  background:var(--glass-bg);
  backdrop-filter:blur(18px) saturate(150%); -webkit-backdrop-filter:blur(18px) saturate(150%);
  border:1px solid var(--glass-brd); border-radius:28px; padding:22px 18px 18px;
  box-shadow:var(--shadow-soft);
}
.secoes > .com-eyebrow ~ .com-eyebrow{ margin-top:18px; }
.eyebrow + .widget,.eyebrow + .card-link{ margin-top:10px; }
.widget h2{
  font-family:var(--font-display); font-weight:800; font-size:1.35rem; letter-spacing:-.3px; line-height:1.15; color:var(--blue-light);
}
.widget-sub{ margin-top:6px; font-size:.8rem; line-height:1.45; color:var(--blue-dark-70); }

.curso{
  display:inline-flex; align-items:center; justify-content:center; margin-top:16px; width:100%;
  background:var(--blue-light); color:#f1f1f1; font-weight:800; font-size:.84rem;
  padding:12px 18px; border-radius:16px; transition:transform .18s ease;
}
.curso:active{ transform:scale(.96); }

/* =====================  WHATSAPP  ===================== */
.zap{ text-align:center; padding:26px 20px 22px; }
.zap h2{ font-size:1.6rem; }
.zap-numero{ color:var(--blue-light); margin-top:10px; font-weight:700; font-size:1.05rem; letter-spacing:.02em; }
.zap-btn{
  display:inline-flex; align-items:center; justify-content:center; gap:10px; margin-top:16px; width:100%; max-width:260px;
  background:#25D366; color:var(--white); padding:12px 18px; border-radius:16px; font-weight:800; font-size:.86rem;
  box-shadow:0 10px 24px rgba(37,211,102,0.32); transition:transform .18s ease;
}
.zap-btn:active{ transform:scale(.96); }
.zap-btn svg{ width:19px; height:19px; }

.rodape{ text-align:center; padding:28px 20px calc(30px + env(safe-area-inset-bottom)); font-size:.66rem; letter-spacing:.04em; color:var(--blue-dark-70); }
.rodape strong{ font-weight:700; }

/* =====================  SEÇÕES (montadas pela config)  ===================== */
.secoes{ display:flex; flex-direction:column; gap:14px; padding:0 18px; }
#concierge{ margin-bottom:30px; }
.secoes > .bloco:first-child:not(#concierge){ margin-top:26px; }
.carregando .hero-name, .carregando .socials, .carregando .secoes{ visibility:hidden; }
a[aria-disabled="true"]{ opacity:.55; pointer-events:none; }
.preview-ativo [data-sec]{ cursor:pointer; }
html.preview-ativo{ scrollbar-width:none; }
html.preview-ativo::-webkit-scrollbar{ display:none; }

/* card de link único (Equipamentos): ícone, título, descrição e seta externa */
.card-link{
  display:flex; align-items:center; gap:13px; padding:14px 16px 14px 14px; border-radius:22px;
  background:var(--glass-bg);
  backdrop-filter:blur(18px) saturate(150%); -webkit-backdrop-filter:blur(18px) saturate(150%);
  border:1px solid var(--glass-brd); box-shadow:var(--shadow-soft);
  transition:transform .18s ease;
}
.card-link:active{ transform:scale(.97); }
.card-link-icone{
  width:48px; height:48px; border-radius:14px; flex-shrink:0; overflow:hidden;
  background:var(--blue-light); color:var(--white);
  display:flex; align-items:center; justify-content:center;
}
.card-link-icone svg{ width:23px; height:23px; }
.card-link-icone img{ width:100%; height:100%; object-fit:cover; }
.card-link-txt{ flex:1; min-width:0; }
.card-link-txt strong{ display:block; font-family:var(--font-display); font-size:1.12rem; font-weight:800; letter-spacing:-.2px; line-height:1.2; color:var(--blue-light); }
.card-link-txt small{ display:block; margin-top:3px; font-size:.7rem; font-weight:500; line-height:1.4; color:var(--blue-dark-70); }
.card-link-seta{ width:18px; height:18px; flex-shrink:0; color:var(--blue-light); }
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>

<main class="bio" id="bio">

  <!-- TOPO: foto em destaque + nome (tudo vem da config; veja DEFAULTS no script) -->
  <header class="hero" data-sec="perfil">
    <div class="hero-glow"></div>
    <img class="hero-photo" id="heroFoto" src="/fotos/hero-capa.png" alt="">
    <div class="hero-fade"></div>
    <div class="hero-name">
      <h1 id="heroNome"></h1>
      <p id="heroBio"></p>
    </div>
  </header>

  <nav class="socials" id="redes" data-sec="perfil" aria-label="Redes sociais"></nav>

  <div class="secoes" id="secoes"></div>

  <footer class="rodape">Feito por <strong>Bruna Medeiros</strong></footer>
</main>

<div class="modal" id="chatModal" role="dialog" aria-modal="true" aria-label="Concierge">
  <div class="modal-backdrop" id="chatBackdrop"></div>
    <div class="concierge">
      <div class="concierge-top">
        <div class="concierge-avatar"><img id="chatAvatarTopo" src="/fotos/lock-avatar.jpg" alt=""></div>
        <div>
          <strong id="chatNome"></strong>
          <span id="chatStatus"></span>
        </div>
        <button class="concierge-close" id="fecharChat" type="button" aria-label="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="chat-body">
        <div class="chat-log" id="chatLog" aria-live="polite"></div>
        <div class="chat-start" id="chatStart">
          <div class="chat-start-avatar"><img id="chatAvatarInicio" src="/fotos/lock-avatar.jpg" alt=""></div>
          <strong id="chatInicioTitulo"></strong>
          <p id="chatInicioTexto"></p>
          <button class="chat-start-btn" id="chatStartBtn" type="button"></button>
        </div>
      </div>
      <form class="chat-form" id="chatForm" autocomplete="off">
        <input class="chat-input" id="chatInput" type="text" placeholder="Digite sua resposta..." maxlength="200" aria-label="Digite sua resposta" disabled>
        <button class="chat-send" id="chatSend" type="submit" aria-label="Enviar" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </form>
    </div>
</div>

<script>
/* =====================================================================
   LINK NA BIO

   Nada do conteúdo desta página fica escrito no HTML: textos, links,
   botões e o fluxo do chat vêm da configuração salva no painel
   (Instagram > Link na bio) e são lidos da Edge Function "bio-publico".

   DEFAULTS abaixo é só o ponto de partida (e o plano B se a internet
   falhar): o que for salvo no painel passa por cima.

   Modo ?preview=1: usado pelo painel (iframe). Não registra visitas nem
   cliques, recebe a config em tempo real por postMessage e avisa o painel
   qual seção foi tocada.

/* ---------------- utilidades ---------------- */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
function urlSegura(u){ u = String(u || '').trim(); return /^(https?:\/\/|mailto:|tel:|\/|#)/i.test(u) ? u : ''; }
function clonar(o){ return JSON.parse(JSON.stringify(o)); }
function ehObjeto(x){ return x && typeof x === 'object' && !Array.isArray(x); }
function mesclar(base, extra){
  if (!ehObjeto(base) || !ehObjeto(extra)) return extra === undefined ? base : extra;
  var r = {};
  Object.keys(base).forEach(function(k){ r[k] = clonar(base[k]); });
  Object.keys(extra).forEach(function(k){ r[k] = (k in base) ? mesclar(base[k], extra[k]) : clonar(extra[k]); });
  return r;
}
function soDigitos(s){ return String(s || '').replace(/\D/g, ''); }
function numeroZap(n){ var d = soDigitos(n); return (d.length === 10 || d.length === 11) ? '55' + d : d; }
function numeroBonito(n){
  var d = soDigitos(n);
  if (d.indexOf('55') === 0 && d.length >= 12) d = d.slice(2);
  if (d.length === 11) return '(' + d.slice(0, 2) + ') ' + d.slice(2, 7) + '-' + d.slice(7);
  if (d.length === 10) return '(' + d.slice(0, 2) + ') ' + d.slice(2, 6) + '-' + d.slice(6);
  return d;
}

}
function urlRede(id){
  var r = (cfg.perfil.redes || []).filter(function(x){ return x.id === id; })[0];

function attrsLink(href){
  if (!href) return ' href="#" aria-disabled="true"';
  var externo = href.charAt(0) !== '#';
  return ' href="' + esc(href) + '"' + (externo ? ' target="_blank" rel="noopener"' : '');
}

function idVisitante(){
  if (visitante) return visitante;
  try { visitante = localStorage.getItem('bio_vid'); } catch(e){}
  if (!visitante) {
    visitante = 'v' + Math.random().toString(36).slice(2, 12) + Date.now().toString(36);
    try { localStorage.setItem('bio_vid', visitante); } catch(e){}
  }
  return visitante;
}
function enviarEvento(tipo, elemento){
  if (semMetricas) return;
  var corpo = JSON.stringify({ tipo: tipo, elemento: elemento, visitante: idVisitante() });
  try {
    if (navigator.sendBeacon && navigator.sendBeacon(API, new Blob([corpo], { type: 'text/plain' }))) return;
  } catch(e){}
  try { fetch(API, { method: 'POST', body: corpo, keepalive: true }); } catch(e){}
}

  var c = cfg.concierge;
  document.getElementById('chatNome').textContent = c.chat.nome;
  document.getElementById('chatStatus').textContent = c.chat.status;
  var av = urlSegura(c.chat.avatar) || DEFAULTS.concierge.chat.avatar;
  document.getElementById('chatAvatarTopo').src = av;
  document.getElementById('chatAvatarInicio').src = av;
  document.getElementById('chatInicioTitulo').textContent = c.chat.inicio_titulo;
  document.getElementById('chatInicioTexto').textContent = c.chat.inicio_texto;
  document.getElementById('chatStartBtn').textContent = c.chat.botao_inicio;
  document.getElementById('chatModal').setAttribute('aria-label', c.chat.nome);

  var assinatura = JSON.stringify(c);
  if (assinatura !== ultimoConcierge) { ultimoConcierge = assinatura; reiniciarChat(); }
}

function aplicarConfig(salva){
  cfg = mesclar(DEFAULTS, salva || {});
  var nos = salva && salva.concierge && salva.concierge.fluxo && salva.concierge.fluxo.nos;
  if (nos) cfg.concierge.fluxo.nos = clonar(nos);
  renderizar();
}

/* ---------------- cliques ---------------- */
document.addEventListener('click', function(e){
  var alvo = e.target.closest ? e.target.closest('[data-bio-id]') : null;
  var secao = e.target.closest ? e.target.closest('[data-sec]') : null;
  if (PREVIEW) {
    var ehChat = alvo && alvo.id === 'abrirChat';
    if (!ehChat && e.target.closest && e.target.closest('a')) e.preventDefault();
    if (secao && window.parent !== window) window.parent.postMessage({ tipo: 'bio:selecionar', secao: secao.getAttribute('data-sec') }, location.origin);
    return;
  }
  if (alvo) enviarEvento('click', alvo.getAttribute('data-bio-id'));
});

/* ---------------- Concierge: motor do fluxo ---------------- */
var chatLog = document.getElementById('chatLog');
var chatForm = document.getElementById('chatForm');
var chatInput = document.getElementById('chatInput');
var chatSend = document.getElementById('chatSend');
var chatStart = document.getElementById('chatStart');
var chatModal = document.getElementById('chatModal');

function abrirChat(){
  chatModal.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function fecharChat(){
  chatModal.classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('click', function(e){
  if (e.target.closest && e.target.closest('#abrirChat')) abrirChat();
});
document.getElementById('fecharChat').addEventListener('click', fecharChat);
document.getElementById('chatBackdrop').addEventListener('click', fecharChat);
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') fecharChat(); });

var geracao = 0;
var conversando = false;
var aguardandoTexto = null;

function rolar(){ chatLog.scrollTop = chatLog.scrollHeight; }
function esperar(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function parado(){ return new Promise(function(){}); }

function addMsg(texto, quem){
  var el = document.createElement('div');
  el.className = 'msg ' + quem;
  el.textContent = texto;
  chatLog.appendChild(el);
  rolar();
}
function addActions(botoes){
  var wrap = document.createElement('div');
  wrap.className = 'msg-actions';
  botoes.forEach(function(b){
    var href = destino(b);
    var link = document.createElement('a');
    link.className = 'msg-action';
    link.setAttribute('data-bio-id', 'concierge_acao');
    link.href = href || '#';
    if (href && href.charAt(0) !== '#') { link.target = '_blank'; link.rel = 'noopener'; }
    else link.addEventListener('click', fecharChat);
    link.textContent = b.rotulo;
    wrap.appendChild(link);
  });
  chatLog.appendChild(wrap);
  rolar();
}

// mensagem da Bruna, com "digitando..." antes
function bot(texto, g){
  var dig = document.createElement('div');
  dig.className = 'typing';
  dig.innerHTML = '<i></i><i></i><i></i>';
  chatLog.appendChild(dig);
  rolar();
  return esperar(550 + Math.min(texto.length * 11, 800)).then(function(){
    if (g !== geracao) return parado();
    dig.remove();
    addMsg(texto, 'bot');
  });
}

// botões de resposta; ao clicar, vira mensagem da pessoa
function escolher(lista, suave){
  return new Promise(function(resolve){
    var wrap = document.createElement('div');
    wrap.className = 'opcoes';
    lista.forEach(function(op, i){
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'opcao' + (suave ? ' suave' : '');
      b.textContent = op.rotulo;
      b.addEventListener('click', function(){
        wrap.remove();
        addMsg(op.rotulo, 'user');
        resolve(op);
      });
      wrap.appendChild(b);
    });
    chatLog.appendChild(wrap);
    rolar();
  });
}

// resposta escrita na barrinha
function pedirTexto(dica){
  return new Promise(function(resolve){
    aguardandoTexto = resolve;
    chatInput.disabled = false; chatSend.disabled = false;
    chatInput.placeholder = dica || 'Digite sua resposta...';
    chatInput.focus({ preventScroll: true });
  });
}
chatForm.addEventListener('submit', function(e){
  e.preventDefault();
  var texto = chatInput.value.trim();
  if (!texto || !aguardandoTexto) return;
  var resolver = aguardandoTexto;
  aguardandoTexto = null;
  chatInput.value = ''; chatInput.disabled = true; chatSend.disabled = true;
  chatInput.placeholder = 'Digite sua resposta...';
  addMsg(texto, 'user');
  resolver(texto);
});

function recomecar(g){
  return escolher([{ rotulo: 'Recomeçar conversa' }], true).then(function(){
    if (g !== geracao) return parado();
    chatLog.innerHTML = '';
    vars = {};
    return rodarNo(cfg.concierge.fluxo.inicio, g);
  });
}

// cada nó do fluxo: msg (fala), texto (pergunta digitada), escolha (botões), acoes (botões de link)
function rodarNo(id, g){
  if (g !== geracao) return parado();
  var no = cfg.concierge.fluxo.nos[id];
  if (!no) return recomecar(g);
  var seguir = function(prox){ return prox && cfg.concierge.fluxo.nos[prox] ? rodarNo(prox, g) : recomecar(g); };

  if (no.tipo === 'msg') {
    return bot(trocarVars(no.texto), g).then(function(){ return seguir(no.proximo); });
  }
  if (no.tipo === 'texto') {
    return pedirTexto(no.dica).then(function(texto){
      if (g !== geracao) return parado();
      vars[no.guardar || 'resposta'] = texto.slice(0, no.max || 200);
      return seguir(no.proximo);
    });
  }
  if (no.tipo === 'escolha') {
    return escolher(no.opcoes || []).then(function(op){
      if (g !== geracao) return parado();
      if (no.guardar) vars[no.guardar] = op.rotulo;
      return seguir(op.proximo);
    });
  }
  if (no.tipo === 'acoes') {
    addActions(no.botoes || []);
    return no.proximo ? seguir(no.proximo) : recomecar(g);
  }
  return recomecar(g);
}

function reiniciarChat(){
  geracao++;
  conversando = false;
  aguardandoTexto = null;
  vars = {};
  chatLog.innerHTML = '';
  chatInput.value = ''; chatInput.disabled = true; chatSend.disabled = true;
  chatStart.classList.remove('off');
}

document.getElementById('chatStartBtn').addEventListener('click', function(){
  if (conversando) return;
  conversando = true;
  chatStart.classList.add('off');
  rodarNo(cfg.concierge.fluxo.inicio, geracao);
});

/* ---------------- carregamento ---------------- */
var rootEl = document.documentElement;
var ultimoJson = null;

function receber(salva){
  var json = JSON.stringify(salva || {});
  if (json === ultimoJson) return;
  ultimoJson = json;
  aplicarConfig(salva);
}

if (PREVIEW) {
  rootEl.classList.add('preview-ativo');
  window.addEventListener('message', function(e){
    if (e.origin !== location.origin || !e.data) return;
    if (e.data.tipo === 'bio:config') { ultimoJson = null; receber(e.data.config); }
    if (e.data.tipo === 'bio:rolar') {
      var el = document.querySelector('[data-sec="' + String(e.data.secao).replace(/[^a-z_]/g, '') + '"]');
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  });
  aplicarConfig({});
  if (window.parent !== window) window.parent.postMessage({ tipo: 'bio:pronto', defaults: DEFAULTS }, location.origin);
} else {
  var cache = null;
  try { cache = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); } catch(e){}
  if (!cache) rootEl.classList.add('carregando');
  receber(cache || {});
  var liberar = function(){ rootEl.classList.remove('carregando'); };
  setTimeout(liberar, 1200);
  fetch(API).then(function(r){ return r.json(); }).then(function(d){
    if (d && d.ok) {
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(d.config || {})); } catch(e){}
      receber(d.config || {});
    }
  }).catch(function(){}).then(liberar);
  enviarEvento('view', 'pagina');
}
</script>
