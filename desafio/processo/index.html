<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Processo · Meu Desafio UGC</title>
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Newsreader:ital,wght@0,700;0,800;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/desafio.css?v=12">
<script>
  // Embutido como aba dentro do Creator Center: esconde o cabeçalho
  // próprio da página (o painel já mostra o título e o "Sair").
  if (window.self !== window.top) document.documentElement.classList.add('embutido');
</script>
</head>
<body class="desafio-body">

  <div class="desafio-wrap wide">
    <div class="topo">
      <div class="marca oculta-embutido">Meu Desafio <span>UGC</span> · processo</div>
      <div><a href="../painel/" class="sair oculta-embutido" style="margin-right:16px;color:inherit;">Meu painel</a><span class="sair" id="btn-sair">Sair</span></div>
    </div>

    <div class="processo-subnav">
      <button class="processo-subnav-btn ativo" data-aba-processo="visao-geral" type="button">Visão Geral</button>
      <button class="processo-subnav-btn" data-aba-processo="tabela" type="button">Tabela de processo</button>
      <button class="processo-subnav-btn" data-aba-processo="videos" type="button">Vídeos</button>
      <button class="processo-subnav-btn" data-aba-processo="desafios" type="button">Desafios</button>
      <button class="processo-subnav-btn" data-aba-processo="meu-painel" type="button">Meu painel</button>
    </div>

    <div id="painel-visao-geral" class="processo-painel carregando">Carregando...</div>
    <div id="painel-tabela" class="processo-painel" hidden></div>
    <div id="painel-videos" class="processo-painel" hidden></div>
    <div id="painel-desafios" class="processo-painel" hidden></div>
  </div>

  <div class="processo-modal-overlay" id="processo-modal-overlay" hidden>
    <div class="processo-modal">
      <h3 id="processo-modal-titulo">Editar desafio</h3>
      <div class="campo"><label>Dia</label><input type="number" id="pm-numero" min="1"></div>
      <div class="campo"><label>Título</label><input type="text" id="pm-titulo" placeholder="Ex: Escolha roupa e cenário pro próximo vídeo"></div>
      <div class="campo"><label>Descrição</label><textarea id="pm-descricao" placeholder="O que a pessoa precisa fazer hoje"></textarea></div>
      <div class="check-row"><input type="checkbox" id="pm-video"> Aceita vídeo opcional pra avaliação</div>
      <div class="campo"><label>Data de publicação</label><input type="date" id="pm-data"></div>
      <div class="check-row"><input type="checkbox" id="pm-gravado"> Já gravei e postei</div>
      <div class="campo">
        <label>Roteiro vinculado</label>
        <div id="pm-roteiro-atual" style="font-size:13px;margin-bottom:6px;">Nenhum</div>
        <button type="button" class="btn btn-secundario" id="pm-btn-vincular" style="width:auto;padding:8px 14px;">Vincular roteiro</button>
        <div id="pm-seletor-roteiro" hidden>
          <input type="text" id="pm-busca-roteiro" placeholder="Buscar roteiro do Banco de Ideias..." style="margin-top:8px;width:100%;border:1px solid var(--borda);border-radius:var(--raio-sm);padding:8px 10px;font-size:13px;font-family:var(--fonte-corpo);color:var(--coral);">
          <div class="processo-modal-lista-busca" id="pm-lista-roteiros"></div>
        </div>
      </div>
      <div id="pm-msg" class="msg msg-erro" hidden></div>
      <div class="processo-modal-acoes">
        <button type="button" class="btn btn-secundario" id="pm-cancelar">Cancelar</button>
        <button type="button" class="btn btn-primary" id="pm-salvar">Salvar</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/auth.js?v=1"></script>
  <script src="../js/admin-render.js?v=1"></script>
  <script>
    const db = DesafioAuth.sb;
    document.getElementById('btn-sair').addEventListener('click', () => DesafioAuth.logout());

    let abaProcessoAtual = null;
    let diasTabelaCache = [];
    let diasDesafiosCache = [];
    let ideiasVinculoCache = null;
    let diaModalId = null;
    let diaModalRoteiroId = null;

    const CARREGADORES_ABA = {
      'visao-geral': carregarVisaoGeral,
      tabela: carregarTabela,
      videos: carregarVideos,
      desafios: carregarDesafios,
    };

    function trocarAbaProcesso(aba) {
      if (aba === 'meu-painel') {
        window.parent.trocarSubAbaDesafio('painel');
        return;
      }
      abaProcessoAtual = aba;
      document.querySelectorAll('.processo-subnav-btn').forEach((b) => b.classList.toggle('ativo', b.dataset.abaProcesso === aba));
      document.querySelectorAll('.processo-painel').forEach((p) => (p.hidden = p.id !== 'painel-' + aba));
      CARREGADORES_ABA[aba]();
    }

    function recarregarAbaAtual() {
      if (abaProcessoAtual && CARREGADORES_ABA[abaProcessoAtual]) CARREGADORES_ABA[abaProcessoAtual]();
    }

    // Cache simples em memória — window.parent.listarIdeiasParaVincularDesafio()
    // pode disparar um carregarPlanejador() inteiro no painel principal na
    // primeira vez, então não vale a pena repetir a cada clique.
    async function obterIdeiasVinculo(forcar) {
      if (ideiasVinculoCache && !forcar) return ideiasVinculoCache;
      ideiasVinculoCache = await window.parent.listarIdeiasParaVincularDesafio();
      return ideiasVinculoCache;
    }

    function formatarDataCurta(data) {
      return data.toLocaleDateString('pt-BR');
    }

    // ---- Aba 1: Visão Geral ----

    function renderCardDia(dataInicio) {
      if (!dataInicio) {
        return `
          <div class="processo-dia-card">
            <div class="titulo">Quando o desafio começa?</div>
            <div class="periodo">Define a data de início pra acompanhar em que dia do desafio você está.</div>
            <div style="margin-top:10px;">
              <input type="date" id="processo-data-inicio">
              <button type="button" class="btn btn-primary" id="btn-salvar-data-inicio" style="width:auto;padding:8px 16px;display:inline-block;margin-left:8px;">Salvar</button>
            </div>
          </div>
        `;
      }
      const inicio = new Date(dataInicio + 'T00:00:00');
      const hoje = new Date();
      hoje.setHours(0, 0, 0, 0);
      const diaAtual = Math.min(16, Math.max(1, Math.floor((hoje - inicio) / 86400000) + 1));
      const fim = new Date(inicio);
      fim.setDate(fim.getDate() + 15);
      return `
        <div class="processo-dia-card">
          <div class="titulo">Dia ${diaAtual} de 16</div>
          <div class="periodo">${formatarDataCurta(inicio)} até ${formatarDataCurta(fim)}</div>
        </div>
      `;
    }

    function wireCardDia() {
      const btn = document.getElementById('btn-salvar-data-inicio');
      if (!btn) return;
      btn.addEventListener('click', async () => {
        const valor = document.getElementById('processo-data-inicio').value;
        if (!valor) return;
        await db.from('desafio_processo').update({ data_inicio: valor }).eq('id', 1);
        carregarVisaoGeral();
      });
    }

    async function carregarVisaoGeral() {
      const painel = document.getElementById('painel-visao-geral');
      painel.innerHTML = '<p class="carregando">Carregando...</p>';

      const seteDiasAtras = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString();

      const [{ data: processo }, { count: totalCadastradas }, { data: dias }, { data: ranking }, { data: ativasRows }] = await Promise.all([
        db.from('desafio_processo').select('data_inicio').eq('id', 1).maybeSingle(),
        db.from('desafio_perfis').select('*', { count: 'exact', head: true }),
        db.from('desafio_dias').select('*').order('numero_dia', { ascending: false }),
        db.from('desafio_ranking').select('*').order('pontos', { ascending: false }),
        db.from('desafio_conclusoes').select('participante_id').gte('feito_em', seteDiasAtras),
      ]);

      const ativasEssaSemana = new Set((ativasRows || []).map((r) => r.participante_id)).size;
      const ultimoDia = (dias && dias[0]) || null;
      let pctUltimoDia = 0;
      if (ultimoDia && totalCadastradas) {
        const { count } = await db.from('desafio_conclusoes').select('*', { count: 'exact', head: true }).eq('dia_id', ultimoDia.id);
        pctUltimoDia = Math.round((100 * (count || 0)) / totalCadastradas);
      }
      const proximoNumero = ultimoDia ? ultimoDia.numero_dia + 1 : 1;

      const { data: videos } = await db
        .from('desafio_conclusoes')
        .select('id, video_path, desafio_perfis(nome,instagram), desafio_dias(numero_dia,titulo), desafio_feedback(texto)')
        .not('video_path', 'is', null)
        .order('feito_em', { ascending: false });

      const { data: bonusHistorico } = await db
        .from('desafio_bonus')
        .select('pontos, motivo, criado_em, desafio_perfis(nome,instagram)')
        .order('criado_em', { ascending: false })
        .limit(20);

      const videosPendentes = (videos || []).filter((v) => !v.desafio_feedback).length;

      painel.innerHTML = `
        ${renderCardDia(processo && processo.data_inicio)}
        ${renderKpiRow({ totalCadastradas, ativasEssaSemana, pctUltimoDia, ultimoDia, videosPendentes })}
        ${renderAdminGrid({ proximoNumero, ranking, bonusHistorico })}
      `;

      wireCardDia();
      wireAdminGridHandlers(db, ranking, { onChanged: carregarVisaoGeral });
    }

    // ---- Aba 2: Tabela de processo ----

    function pillRoteiro(dia, idea) {
      if (!dia.roteiro_ideia_id) return '<span class="processo-pill sem-vinculo">Sem vínculo</span>';
      if (idea && (idea.status === 'Roteiro pronto' || idea.status === 'Publicado')) return '<span class="processo-pill pronto">Pronto</span>';
      return '<span class="processo-pill a-fazer">A fazer</span>';
    }

    function linhaTabelaProcesso(dia, ideiasPorId) {
      const idea = dia.roteiro_ideia_id ? ideiasPorId.get(dia.roteiro_ideia_id) : null;
      const botaoAbrir = dia.roteiro_ideia_id
        ? `<button type="button" class="processo-link-abrir" data-abrir="${dia.roteiro_ideia_id}">Abrir</button>`
        : `<button type="button" class="processo-link-abrir" data-vincular="${dia.id}">Vincular</button>`;
      return `
        <tr data-dia="${dia.id}">
          <td>${dia.numero_dia}</td>
          <td>${dia.titulo}</td>
          <td>${pillRoteiro(dia, idea)} ${botaoAbrir}</td>
          <td>${idea && idea.formato ? idea.formato : '—'}</td>
          <td>${dia.data_publicacao || '—'}</td>
          <td><input type="checkbox" class="processo-check" data-gravado="${dia.id}" ${dia.gravado_postado ? 'checked' : ''}></td>
        </tr>
      `;
    }

    async function carregarTabela() {
      const painel = document.getElementById('painel-tabela');
      painel.innerHTML = '<p class="carregando">Carregando...</p>';

      const [{ data: dias }, ideias] = await Promise.all([
        db.from('desafio_dias').select('*').order('numero_dia', { ascending: true }),
        obterIdeiasVinculo(),
      ]);
      diasTabelaCache = dias || [];
      const ideiasPorId = new Map(ideias.map((i) => [i.id, i]));

      painel.innerHTML = `
        <table class="admin-table">
          <tr><th>Dia</th><th>Tema</th><th>Roteiro</th><th>Formato</th><th>Data</th><th>Gravado</th></tr>
          ${diasTabelaCache.map((dia) => linhaTabelaProcesso(dia, ideiasPorId)).join('') || '<tr><td colspan="6">Nenhum desafio publicado ainda.</td></tr>'}
        </table>
      `;

      document.querySelectorAll('[data-abrir]').forEach((btn) => {
        btn.addEventListener('click', () => window.parent.abrirRoteiroDesafio(btn.dataset.abrir));
      });
      document.querySelectorAll('[data-vincular]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const dia = diasTabelaCache.find((d) => d.id === btn.dataset.vincular);
          if (dia) abrirModalDia(dia);
        });
      });
      document.querySelectorAll('[data-gravado]').forEach((chk) => {
        chk.addEventListener('change', () => {
          db.from('desafio_dias').update({ gravado_postado: chk.checked }).eq('id', chk.dataset.gravado);
        });
      });
    }

    // ---- Aba 3: Vídeos ----

    async function carregarVideos() {
      const painel = document.getElementById('painel-videos');
      painel.innerHTML = '<p class="carregando">Carregando...</p>';

      const { data: videos } = await db
        .from('desafio_conclusoes')
        .select('id, video_path, desafio_perfis(nome,instagram), desafio_dias(numero_dia,titulo), desafio_feedback(texto)')
        .not('video_path', 'is', null)
        .order('feito_em', { ascending: false });

      const avaliados = (videos || []).filter((v) => v.desafio_feedback).length;
      const pendentes = (videos || []).filter((v) => !v.desafio_feedback).length;

      painel.innerHTML = `
        <div class="kpi-row">
          <div class="kpi"><div class="v">${pendentes}</div><div class="l">vídeos pra avaliar</div></div>
          <div class="kpi"><div class="v">${avaliados}</div><div class="l">já avaliados</div></div>
        </div>
        <div id="video-queue">${renderVideoQueue(videos)}</div>
      `;

      wireVideoQueueHandlers(db, { onChanged: carregarVideos });
    }

    // ---- Aba 4: Desafios ----

    function statusDia(dia) {
      if (!dia.data_publicacao) return '<span class="processo-pill a-fazer">Ainda vai acontecer</span>';
      const data = new Date(dia.data_publicacao + 'T00:00:00');
      const hoje = new Date();
      hoje.setHours(0, 0, 0, 0);
      return data <= hoje
        ? '<span class="processo-pill pronto">Já passou</span>'
        : '<span class="processo-pill a-fazer">Ainda vai acontecer</span>';
    }

    function linhaDesafio(dia) {
      return `
        <tr data-dia="${dia.id}">
          <td>${dia.numero_dia}</td>
          <td>${dia.data_publicacao || '—'}</td>
          <td>${dia.titulo}</td>
          <td>${statusDia(dia)}</td>
          <td class="processo-acoes">
            <button type="button" data-editar="${dia.id}">Editar</button>
            <button type="button" class="apagar" data-apagar="${dia.id}">Apagar</button>
          </td>
        </tr>
      `;
    }

    async function carregarDesafios() {
      const painel = document.getElementById('painel-desafios');
      painel.innerHTML = '<p class="carregando">Carregando...</p>';

      const { data: dias } = await db.from('desafio_dias').select('*').order('numero_dia', { ascending: true });
      diasDesafiosCache = dias || [];

      painel.innerHTML = `
        <button type="button" class="btn btn-primary" id="btn-novo-desafio" style="width:auto;padding:10px 18px;margin-bottom:16px;">+ Novo desafio</button>
        <table class="admin-table">
          <tr><th>Dia</th><th>Data</th><th>Tema</th><th>Status</th><th></th></tr>
          ${diasDesafiosCache.map((dia) => linhaDesafio(dia)).join('') || '<tr><td colspan="5">Nenhum desafio publicado ainda.</td></tr>'}
        </table>
      `;

      document.getElementById('btn-novo-desafio').addEventListener('click', () => abrirModalDia(null));
      document.querySelectorAll('[data-editar]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const dia = diasDesafiosCache.find((d) => d.id === btn.dataset.editar);
          if (dia) abrirModalDia(dia);
        });
      });
      document.querySelectorAll('[data-apagar]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const dia = diasDesafiosCache.find((d) => d.id === btn.dataset.apagar);
          if (!dia) return;
          if (!confirm(`Apagar o desafio do dia ${dia.numero_dia}?`)) return;
          await db.from('desafio_dias').delete().eq('id', dia.id);
          carregarDesafios();
        });
      });
    }

    // ---- Modal compartilhado: editar/criar dia + vincular roteiro ----
    // Aberto tanto pela aba Desafios (Editar/+ Novo) quanto pela Tabela de
    // processo (Vincular).

    async function abrirModalDia(dia) {
      diaModalId = dia ? dia.id : null;
      diaModalRoteiroId = dia ? dia.roteiro_ideia_id : null;

      const proximoNumero = diasDesafiosCache.length
        ? Math.max(...diasDesafiosCache.map((d) => d.numero_dia)) + 1
        : diasTabelaCache.length
        ? Math.max(...diasTabelaCache.map((d) => d.numero_dia)) + 1
        : 1;

      document.getElementById('processo-modal-titulo').textContent = dia ? `Editar dia ${dia.numero_dia}` : 'Novo desafio';
      document.getElementById('pm-numero').value = dia ? dia.numero_dia : proximoNumero;
      document.getElementById('pm-titulo').value = dia ? dia.titulo : '';
      document.getElementById('pm-descricao').value = dia ? dia.descricao : '';
      document.getElementById('pm-video').checked = dia ? !!dia.pede_video : false;
      document.getElementById('pm-data').value = dia && dia.data_publicacao ? dia.data_publicacao : '';
      document.getElementById('pm-gravado').checked = dia ? !!dia.gravado_postado : false;
      document.getElementById('pm-seletor-roteiro').hidden = true;
      document.getElementById('pm-msg').hidden = true;

      await atualizarRoteiroAtualModal();
      document.getElementById('processo-modal-overlay').hidden = false;
    }

    function fecharModalDia() {
      document.getElementById('processo-modal-overlay').hidden = true;
    }

    async function atualizarRoteiroAtualModal() {
      const el = document.getElementById('pm-roteiro-atual');
      if (!diaModalRoteiroId) {
        el.textContent = 'Nenhum';
        return;
      }
      const ideias = await obterIdeiasVinculo();
      const idea = ideias.find((i) => i.id === diaModalRoteiroId);
      el.innerHTML = idea
        ? `${idea.titulo} <button type="button" class="processo-link-abrir" id="pm-btn-abrir-roteiro">Abrir</button>`
        : 'Nenhum';
      const btnAbrir = document.getElementById('pm-btn-abrir-roteiro');
      if (btnAbrir) btnAbrir.addEventListener('click', () => window.parent.abrirRoteiroDesafio(diaModalRoteiroId));
    }

    async function renderizarListaRoteirosModal(filtro) {
      const ideias = await obterIdeiasVinculo();
      const termo = filtro.trim().toLowerCase();
      const filtradas = termo
        ? ideias.filter((i) => i.titulo.toLowerCase().includes(termo) || i.pilar.toLowerCase().includes(termo))
        : ideias;
      const lista = document.getElementById('pm-lista-roteiros');
      lista.innerHTML = filtradas.length
        ? filtradas.map((i) => `<div class="processo-modal-lista-item" data-id="${i.id}">${i.titulo}<div class="pilar">${i.pilar || 'Sem pilar'} · ${i.status}</div></div>`).join('')
        : '<div class="processo-modal-lista-item">Nada encontrado.</div>';
      lista.querySelectorAll('.processo-modal-lista-item[data-id]').forEach((item) => {
        item.addEventListener('click', () => {
          diaModalRoteiroId = item.dataset.id;
          document.getElementById('pm-seletor-roteiro').hidden = true;
          atualizarRoteiroAtualModal();
        });
      });
    }

    document.getElementById('pm-btn-vincular').addEventListener('click', async () => {
      const seletor = document.getElementById('pm-seletor-roteiro');
      seletor.hidden = !seletor.hidden;
      if (!seletor.hidden) await renderizarListaRoteirosModal('');
    });

    document.getElementById('pm-busca-roteiro').addEventListener('input', (e) => renderizarListaRoteirosModal(e.target.value));

    document.getElementById('pm-cancelar').addEventListener('click', fecharModalDia);

    document.getElementById('pm-salvar').addEventListener('click', async () => {
      const msg = document.getElementById('pm-msg');
      msg.hidden = true;

      const payload = {
        numero_dia: Number(document.getElementById('pm-numero').value),
        titulo: document.getElementById('pm-titulo').value.trim(),
        descricao: document.getElementById('pm-descricao').value.trim(),
        pede_video: document.getElementById('pm-video').checked,
        data_publicacao: document.getElementById('pm-data').value || null,
        gravado_postado: document.getElementById('pm-gravado').checked,
        roteiro_ideia_id: diaModalRoteiroId || null,
      };
      if (!payload.titulo || !payload.descricao) {
        msg.textContent = 'Preenche título e descrição.';
        msg.hidden = false;
        return;
      }

      const { error } = diaModalId
        ? await db.from('desafio_dias').update(payload).eq('id', diaModalId)
        : await db.from('desafio_dias').insert(payload);
      if (error) {
        msg.textContent = error.message.includes('duplicate') ? 'Já existe um desafio com esse número de dia.' : error.message;
        msg.hidden = false;
        return;
      }
      fecharModalDia();
      recarregarAbaAtual();
    });

    // ---- Início ----

    async function iniciar() {
      const user = await DesafioAuth.checkAuth();
      if (!user) return;
      if (!DesafioAuth.isOwner(user)) {
        window.location.href = '../painel/';
        return;
      }
      document.querySelectorAll('.processo-subnav-btn').forEach((btn) => {
        btn.addEventListener('click', () => trocarAbaProcesso(btn.dataset.abaProcesso));
      });
      trocarAbaProcesso('visao-geral');
    }

    iniciar();
  </script>
</body>
</html>
