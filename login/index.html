<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Acesso restrito | meu.painel</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/js/auth.js"></script>
</head>
<body>

  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">meu<span class="ponto">.</span>painel</div>
      <h1 class="login-title">Acesso restrito</h1>
      <p class="login-subtitle">Faça login para ver os números do seu portfólio.</p>

      <div class="faixa faixa-erro oculto" id="faixa-erro"></div>
      <div class="faixa faixa-sucesso oculto" id="faixa-sucesso"></div>

      <form id="form-login">
        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" required autocomplete="email">
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" required autocomplete="current-password">
        </div>
        <a class="link-esqueci" id="link-esqueci">Esqueci minha senha</a>
        <button type="submit" class="btn-primario" id="btn-entrar">Entrar</button>
      </form>

      <form id="form-recuperar" class="oculto">
        <div class="campo">
          <label for="email-recuperar">E-mail</label>
          <input type="email" id="email-recuperar" name="email-recuperar" required autocomplete="email">
        </div>
        <button type="submit" class="btn-primario" id="btn-recuperar">Enviar link de recuperação</button>
        <a class="link-voltar" id="link-voltar">Voltar para o login</a>
      </form>
    </div>
  </div>

  <script>
    (async function verificarSessaoExistente() {
      const { data } = await window.sb.auth.getSession();
      if (data.session) {
        window.location.href = '/painel';
      }
    })();

    const formLogin = document.getElementById('form-login');
    const formRecuperar = document.getElementById('form-recuperar');
    const linkEsqueci = document.getElementById('link-esqueci');
    const linkVoltar = document.getElementById('link-voltar');
    const faixaErro = document.getElementById('faixa-erro');
    const faixaSucesso = document.getElementById('faixa-sucesso');

    function esconderFaixas() {
      faixaErro.classList.add('oculto');
      faixaSucesso.classList.add('oculto');
    }

    linkEsqueci.addEventListener('click', (e) => {
      e.preventDefault();
      formLogin.classList.add('oculto');
      formRecuperar.classList.remove('oculto');
      esconderFaixas();
    });

    linkVoltar.addEventListener('click', (e) => {
      e.preventDefault();
      formRecuperar.classList.add('oculto');
      formLogin.classList.remove('oculto');
      esconderFaixas();
    });

    formLogin.addEventListener('submit', async (e) => {
      e.preventDefault();
      esconderFaixas();

      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value;
      const btn = document.getElementById('btn-entrar');
      const textoOriginal = btn.textContent;

      btn.disabled = true;
      btn.textContent = 'Entrando...';

      try {
        await window.Auth.login(email, senha);
        window.location.href = '/painel';
      } catch (erro) {
        faixaErro.textContent = erro.message;
        faixaErro.classList.remove('oculto');
        btn.disabled = false;
        btn.textContent = textoOriginal;
      }
    });

    formRecuperar.addEventListener('submit', async (e) => {
      e.preventDefault();
      esconderFaixas();

      const email = document.getElementById('email-recuperar').value.trim();
      const btn = document.getElementById('btn-recuperar');
      const textoOriginal = btn.textContent;

      btn.disabled = true;
      btn.textContent = 'Enviando...';

      try {
        await window.Auth.recuperarSenha(email);
        faixaSucesso.textContent = 'Enviamos um link de recuperação para o seu e-mail.';
        faixaSucesso.classList.remove('oculto');
      } catch (erro) {
        faixaErro.textContent = 'Não foi possível enviar o e-mail de recuperação.';
        faixaErro.classList.remove('oculto');
      } finally {
        btn.disabled = false;
        btn.textContent = textoOriginal;
      }
    });
  </script>
</body>
</html>
