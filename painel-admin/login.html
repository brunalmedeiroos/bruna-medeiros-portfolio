<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Login - Creator Center</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20260901a">
<!-- Paleta e tipografia do site principal (index.html), só nesta página -->
<link rel="stylesheet" href="css/login-theme.css?v=20260901i">
</head>
<body class="login-body">

  <div class="login-wrap">
    <div class="login-card">
      <div class="logo">Creator <span class="logo-dot">Center</span></div>

      <h1>Acesso restrito</h1>
      <p class="subtitle">Faça login para ver os números do seu portfólio.</p>

      <div id="msg-erro" class="banner banner-erro" hidden></div>
      <div id="msg-sucesso" class="banner banner-sucesso" hidden></div>

      <!-- Formulário de login -->
      <form id="form-login">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required autocomplete="username" placeholder="voce@email.com">

        <label for="senha">Senha</label>
        <div class="campo-senha">
          <input type="password" id="senha" name="senha" required autocomplete="current-password" placeholder="Sua senha">
          <button type="button" class="btn-mostrar-senha" data-target="senha" aria-label="Mostrar senha" aria-pressed="false">
            <svg class="icone-olho-aberto" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/>
              <path fill-rule="evenodd" clip-rule="evenodd" d="M1.323 11.447C2.811 6.976 7.028 3.75 12.001 3.75c4.97 0 9.185 3.223 10.675 7.69.12.362.12.752 0 1.113-1.487 4.471-5.705 7.697-10.677 7.697-4.97 0-9.186-3.223-10.674-7.69a1.762 1.762 0 0 1 0-1.113ZM17.25 12a5.25 5.25 0 1 1-10.5 0 5.25 5.25 0 0 1 10.5 0Z"/>
            </svg>
            <svg class="icone-olho-fechado" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <path d="M3.53 2.47a.75.75 0 0 0-1.06 1.06l18 18a.75.75 0 1 0 1.06-1.06l-18-18ZM22.676 12.553a11.249 11.249 0 0 1-2.631 4.31l-3.099-3.099a5.25 5.25 0 0 0-6.71-6.71L7.759 4.577a11.217 11.217 0 0 1 4.242-.827c4.97 0 9.185 3.223 10.675 7.69.12.362.12.752 0 1.113Z"/>
              <path d="M15.75 12c0 .18-.013.357-.037.53l-4.244-4.243A3.75 3.75 0 0 1 15.75 12ZM12.53 15.713l-4.243-4.244a3.75 3.75 0 0 0 4.244 4.243Z"/>
              <path d="M6.75 12c0-.619.107-1.213.304-1.764l-3.1-3.1a11.25 11.25 0 0 0-2.63 4.31c-.12.362-.12.752 0 1.114 1.489 4.467 5.704 7.69 10.675 7.69 1.5 0 2.933-.294 4.242-.827l-2.477-2.477A5.25 5.25 0 0 1 6.75 12Z"/>
            </svg>
          </button>
        </div>

        <button type="submit" id="btn-entrar" class="btn-primary">Entrar</button>

        <a href="#" id="link-esqueci" class="link-esqueci">Esqueci minha senha</a>
      </form>

      <!-- Formulário de recuperação de senha (substitui o de login) -->
      <form id="form-recuperar" hidden>
        <label for="email-recuperar">E-mail</label>
        <input type="email" id="email-recuperar" required placeholder="voce@email.com">

        <button type="submit" id="btn-recuperar" class="btn-primary">Enviar link de recuperação</button>

        <a href="#" id="link-voltar" class="link-esqueci">Voltar para o login</a>
      </form>
    </div>
  </div>

  <!-- Supabase via CDN, seguido da lógica de autenticação compartilhada -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/auth.js?v=20260901c"></script>
  <script>
    // ---- Lógica da página de login ----

    const formLogin = document.getElementById('form-login');
    const formRecuperar = document.getElementById('form-recuperar');
    const linkEsqueci = document.getElementById('link-esqueci');
    const linkVoltar = document.getElementById('link-voltar');
    const msgErro = document.getElementById('msg-erro');
    const msgSucesso = document.getElementById('msg-sucesso');
    const btnEntrar = document.getElementById('btn-entrar');
    const btnRecuperar = document.getElementById('btn-recuperar');

    function esconderMensagens() {
      msgErro.hidden = true;
      msgSucesso.hidden = true;
    }

    // Se já houver uma sessão ativa, pula direto para o painel.
    (async () => {
      const { data: { session } } = await Auth.sb.auth.getSession();
      if (session) {
        window.location.href = 'painel.html';
      }
    })();

    // Alterna entre o formulário de login e o de recuperação de senha.
    linkEsqueci.addEventListener('click', (e) => {
      e.preventDefault();
      esconderMensagens();
      formLogin.hidden = true;
      formRecuperar.hidden = false;
    });

    linkVoltar.addEventListener('click', (e) => {
      e.preventDefault();
      esconderMensagens();
      formRecuperar.hidden = true;
      formLogin.hidden = false;
    });

    // Envio do login.
    formLogin.addEventListener('submit', async (e) => {
      e.preventDefault();
      esconderMensagens();

      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value;

      btnEntrar.disabled = true;
      btnEntrar.textContent = 'Entrando...';

      try {
        await Auth.login(email, senha);
        window.location.href = 'painel.html';
      } catch (err) {
        msgErro.textContent = err.message || 'Não foi possível entrar. Tente novamente.';
        msgErro.hidden = false;
        btnEntrar.disabled = false;
        btnEntrar.textContent = 'Entrar';
      }
    });

    // Envio da recuperação de senha.
    formRecuperar.addEventListener('submit', async (e) => {
      e.preventDefault();
      esconderMensagens();

      const email = document.getElementById('email-recuperar').value.trim();

      btnRecuperar.disabled = true;
      btnRecuperar.textContent = 'Enviando...';

      try {
        await Auth.recuperarSenha(email);
        msgSucesso.textContent = 'Enviamos um link de recuperação para o seu e-mail.';
        msgSucesso.hidden = false;
      } catch (err) {
        msgErro.textContent = 'Não foi possível enviar o link. Verifique o e-mail informado.';
        msgErro.hidden = false;
      } finally {
        btnRecuperar.disabled = false;
        btnRecuperar.textContent = 'Enviar link de recuperação';
      }
    });

    // Mostrar/ocultar senha.
    document.querySelectorAll('.btn-mostrar-senha').forEach((btn) => {
      btn.addEventListener('click', () => {
        const input = document.getElementById(btn.dataset.target);
        const paraTexto = input.type === 'password';
        input.type = paraTexto ? 'text' : 'password';
        btn.classList.toggle('mostrando', paraTexto);
        btn.setAttribute('aria-pressed', String(paraTexto));
        btn.setAttribute('aria-label', paraTexto ? 'Ocultar senha' : 'Mostrar senha');
      });
    });
  </script>
</body>
</html>
