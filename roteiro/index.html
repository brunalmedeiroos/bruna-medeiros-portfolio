<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roteiro para aprovação — Bruna Medeiros</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="../favicon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

<style>
  :root{
    --blue-light: #7DB7CE;
    --blue-dark:  #04465D;
    --butter:     #FFF7C5;
    --white:      #FFFFFF;
    --offwhite:   #FAF9F4;
    --blue-dark-70: rgba(4,70,93,0.7);
    --blue-dark-15: rgba(4,70,93,0.12);
    --shadow-soft: 0 20px 45px rgba(4,70,93,0.16);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    font-family:'Montserrat', sans-serif;
    color:var(--blue-dark);
    background:var(--offwhite);
    min-height:100vh;
    padding:32px 16px 64px;
  }
  .pagina{
    max-width:640px;
    margin:0 auto;
  }
  .topo{
    text-align:center;
    margin-bottom:28px;
  }
  .topo .assinatura{
    font-size:13px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--blue-dark-70);
    font-weight:600;
  }
  .cartao{
    background:var(--white);
    border-radius:20px;
    box-shadow:var(--shadow-soft);
    padding:28px 24px;
    margin-bottom:20px;
  }
  .marca{
    font-size:22px;
    font-weight:700;
    margin-bottom:4px;
  }
  .detalhes{
    font-size:14px;
    color:var(--blue-dark-70);
    margin-bottom:18px;
  }
  .campo{
    margin-bottom:16px;
  }
  .campo:last-child{ margin-bottom:0; }
  .campo-titulo{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--blue-dark-70);
    font-weight:700;
    margin-bottom:4px;
  }
  .campo-texto{
    font-size:15px;
    line-height:1.5;
    white-space:pre-wrap;
  }
  h2.secao{
    font-size:16px;
    font-weight:700;
    margin:8px 0 12px;
  }
  .cena{
    background:var(--white);
    border-radius:16px;
    box-shadow:var(--shadow-soft);
    padding:20px;
    margin-bottom:14px;
  }
  .cena-numero{
    display:inline-block;
    font-size:12px;
    font-weight:700;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--white);
    background:var(--blue-light);
    padding:4px 10px;
    border-radius:999px;
    margin-bottom:12px;
  }
  .estado{
    text-align:center;
    padding:60px 16px;
    color:var(--blue-dark-70);
    font-size:15px;
  }
  .rodape{
    text-align:center;
    font-size:12px;
    color:var(--blue-dark-70);
    margin-top:28px;
  }
  [hidden]{ display:none !important; }
</style>
</head>
<body>

<div class="pagina">
  <div class="topo">
    <div class="assinatura">Bruna Medeiros</div>
  </div>

  <div id="estado-carregando" class="estado">Carregando roteiro...</div>
  <div id="estado-erro" class="estado" hidden>Este link não é válido ou o roteiro foi removido. Peça um novo link.</div>

  <div id="conteudo" hidden>
    <div class="cartao">
      <div id="rt-marca" class="marca"></div>
      <div id="rt-detalhes" class="detalhes"></div>
      <div id="rt-objetivo-campo" class="campo" hidden>
        <div class="campo-titulo">Objetivo</div>
        <div id="rt-objetivo" class="campo-texto"></div>
      </div>
    </div>

    <h2 class="secao">Cenas</h2>
    <div id="rt-cenas"></div>
  </div>

  <div class="rodape">Roteiro compartilhado para aprovação.</div>
</div>

<script>
(function () {
  var FUNCTION_URL = 'https://trfoymytrvdbslwizfqs.supabase.co/functions/v1/roteiro-publico';

  function texto(el, valor) {
    el.textContent = valor || '';
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function mostrarErro() {
    document.getElementById('estado-carregando').hidden = true;
    document.getElementById('estado-erro').hidden = false;
  }

  function renderizar(roteiro, cenas) {
    texto(document.getElementById('rt-marca'), roteiro.marca || 'Roteiro');
    texto(
      document.getElementById('rt-detalhes'),
      [roteiro.produto, roteiro.campanha, roteiro.tipo_conteudo, roteiro.duracao_prevista]
        .filter(Boolean)
        .join(' · ')
    );

    if (roteiro.objetivo) {
      document.getElementById('rt-objetivo-campo').hidden = false;
      texto(document.getElementById('rt-objetivo'), roteiro.objetivo);
    }

    var cont = document.getElementById('rt-cenas');
    if (!cenas || cenas.length === 0) {
      cont.innerHTML = '<div class="cena">Nenhuma cena cadastrada ainda.</div>';
    } else {
      cont.innerHTML = cenas
        .map(function (c, i) {
          var blocos = [];
          if (c.fala) blocos.push('<div class="campo"><div class="campo-titulo">Fala</div><div class="campo-texto">' + escapeHtml(c.fala) + '</div></div>');
          if (c.o_que_fazer) blocos.push('<div class="campo"><div class="campo-titulo">O que fazer</div><div class="campo-texto">' + escapeHtml(c.o_que_fazer) + '</div></div>');
          if (c.cena_broll) blocos.push('<div class="campo"><div class="campo-titulo">Cena/B-roll</div><div class="campo-texto">' + escapeHtml(c.cena_broll) + '</div></div>');
          return (
            '<div class="cena">' +
            '<span class="cena-numero">Cena ' + String(i + 1).padStart(2, '0') + '</span>' +
            (blocos.join('') || '<div class="campo-texto">Sem detalhes ainda.</div>') +
            '</div>'
          );
        })
        .join('');
    }

    document.getElementById('estado-carregando').hidden = true;
    document.getElementById('conteudo').hidden = false;
    document.title = (roteiro.marca ? roteiro.marca + ' — ' : '') + 'Roteiro para aprovação';
  }

  var params = new URLSearchParams(window.location.search);
  var id = params.get('id');
  var token = params.get('token');

  if (!id || !token) {
    mostrarErro();
    return;
  }

  fetch(FUNCTION_URL + '?id=' + encodeURIComponent(id) + '&token=' + encodeURIComponent(token))
    .then(function (r) { return r.json(); })
    .then(function (resp) {
      if (!resp || !resp.ok) throw new Error('not ok');
      renderizar(resp.roteiro, resp.cenas);
    })
    .catch(function (err) {
      console.error('Erro ao carregar roteiro público:', err);
      mostrarErro();
    });
})();
</script>

</body>
</html>
